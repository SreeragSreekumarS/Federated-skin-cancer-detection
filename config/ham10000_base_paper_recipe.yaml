# HAM10000 profile matching the base paper's image/training recipe.
# The project's patient/lesion-safe hospital-first split is retained.
seed: 42
split_seed: 42
partition_mode: hospital_first
run_name: ham10000_base_paper_recipe
model_name: mobilenet_v3_large
optimizer: sgd
use_metadata: false
decision_metric: accuracy
decision_accuracy_loss_cap: 0.01
checkpoint_metric: accuracy
class_weighting: none
preserve_melanoma_sensitivity: false
aggregation_weighting: samples
batchnorm_policy: average
freeze_early_stages: 0
server_momentum: 0.0
min_groups_per_class_per_hospital: 3
clients: 3
dirichlet_alpha: 0.5
rounds: 50
client_fraction: 1.0
local_epochs: 3
batch_size: 32
gradient_accumulation: 1
num_workers: 2
image_size: 224
use_cbam: false
classifier_hidden_dim: 256
classifier_dropout: 0.0
multiscale_head: false
multiscale_feature_dim: 128
pooling: avg
normalization_mean: [0.0, 0.0, 0.0]
normalization_std: [1.0, 1.0, 1.0]
learning_rate: 0.0001
backbone_learning_rate: 0.0001
layerwise_lr_decay: 1.0
lr_patience: 100
lr_factor: 0.5
min_learning_rate: 0.0001
weight_decay: 0.0
drop_path_rate: 0.0
ema_decay: 0.995
server_ema_decay: 0.9
mixup_alpha: 0.0
cutmix_alpha: 0.0
mixup_cutmix_probability: 0.0
fedprox_mu: 0.0
focal_gamma: 0.0
label_smoothing: 0.0
early_stopping_patience: 100
freeze_backbone_rounds: 0
train_fraction: 0.7
val_fraction: 0.15
test_fraction: 0.15
tta: false
tta_views: 1
amp: true
strong_augmentation: false
image_enhancement: false
hair_removal_probability: 0.0
color_constancy: false
balanced_sampling: false
balanced_sampling_power: 1.0
client_logit_adjustment_strength: 0.0
cache_resized_images: true
