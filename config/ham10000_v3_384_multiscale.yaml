# Controlled architecture comparison against ham10000_v3_384_fedprox_accuracy.
# Only the classifier head differs; keep the sampling, decision rule, and
# client logit adjustment identical to the baseline.
seed: 42
split_seed: 42
partition_mode: hospital_first
run_name: ham10000_v3_384_multiscale_balanced
model_name: mobilenet_v3_large
use_metadata: true
decision_metric: accuracy
decision_accuracy_loss_cap: 0.01
checkpoint_metric: accuracy
class_weighting: none
preserve_melanoma_sensitivity: true
aggregation_weighting: samples
min_groups_per_class_per_hospital: 3
clients: 3
dirichlet_alpha: 1.0
rounds: 50
client_fraction: 1.0
local_epochs: 3
batch_size: 32
gradient_accumulation: 1
num_workers: 2
image_size: 384
use_cbam: true
classifier_hidden_dim: 256
classifier_dropout: 0.30
multiscale_head: true
multiscale_feature_dim: 128
learning_rate: 0.0005
backbone_learning_rate: 0.00005
layerwise_lr_decay: 0.9
lr_patience: 3
lr_factor: 0.5
min_learning_rate: 0.000001
weight_decay: 0.01
drop_path_rate: 0.1
ema_decay: 0.995
server_ema_decay: 0.9
mixup_alpha: 0.1
cutmix_alpha: 0.5
mixup_cutmix_probability: 0.2
fedprox_mu: 0.01
focal_gamma: 0.0
label_smoothing: 0.0
early_stopping_patience: 10
freeze_backbone_rounds: 2
train_fraction: 0.70
val_fraction: 0.15
test_fraction: 0.15
tta: true
tta_views: 8
amp: true
strong_augmentation: true
image_enhancement: false
hair_removal_probability: 0.0
color_constancy: false
balanced_sampling: false
balanced_sampling_power: 0.5
client_logit_adjustment_strength: 0.0
cache_resized_images: true
